<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
    <section class="formulario">
        <h1>Entre com seus dados</h1>
        <input type="text" name="" id="numero" placeholder="Digite aqui o numero do cartão.">
        <input type="text" name="" id="nome" placeholder="Digite aqui o seu nome.">
        <input type="text" name="" id="validade" placeholder="Digite aqui a validade.">
        <input type="number" name="" id="cvv" placeholder="Digite aqui o codigo de transação.">
        

    </section>
    <section class="cartao">
        <h1>SENAI bank <img src="assets/senai-165.svg" alt=""></h1>
        <div class="numero-cartao" id="mostrarNumero">
            0000 0000 0000 0000
        </div>
        <div class="nome-cartao" id="mostrarNome">
            Sr, Donizildo
        </div>
        <div class="validade" id="mostrarValidade">
            03/2034
        </div>
        <div class="cvv" id="mostrarCvv">
            432
        </div>
        <img id="master" src="assets/mastercard-svgrepo-com.svg" alt="">


    </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
