<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lanterna</title>

    <style>

            body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            flex-direction: column;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Fruta</h1>
    <button onclick="mudarFruta()">Mudar Fruta</button>
    

    <script>
        function mudarFruta() {
            const frutas = ['Maçã', 'Banana', 'Laranja', 'Uva', 'Morango'];
            const frutaAleatoria = frutas[Math.floor(Math.random() * frutas.length)];
            document.querySelector('h1').textContent = frutaAleatoria;
        }
    </script>
    
</body>
</html>
