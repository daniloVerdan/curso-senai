
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janela Windows 98</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="janela" id="janela">
        <div class="barra-titulo">
            <span>Meu programa.exe</span>

            <div class="botoes">
                <button id="minimizar">_</button>
                <button id="maximizar">□</button>
                <button id="fechar">×</button>
            </div>
        </div>

        <div class="menu">
            <span>Arquivo</span>
            <span>Editar</span>
            <span>Exibir</span>
            <span>Ajuda</span>
        </div>

        <div class="conteudo">
            <h3>Bem-vindo!</h3>
            <p>Esta é uma janela feita com HTML, CSS e JavaScript.</p>
            <button onclick="alert('Olá, Windows 98!')">
                Clique aqui
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
